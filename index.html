<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="./style.css">
	<title>Tic Tac Toe</title>
</head>
<body>

	<div id="player1-info" class="player-info">
		<div class="player-header">
			<h2></h2>
			<div></div>
		</div>
		<div class="player-marker"></div>
	</div>
	
	<div id="main-section">
		<h1 id="score"></h1>
		<div id="gameboard">
			<div class="cell" data-row="1" data-column="1"></div>
			<div class="cell" data-row="1" data-column="2"></div>
			<div class="cell" data-row="1" data-column="3"></div>

			<div class="cell" data-row="2" data-column="1"></div>
			<div class="cell" data-row="2" data-column="2"></div>
			<div class="cell" data-row="2" data-column="3"></div>

			<div class="cell" data-row="3" data-column="1"></div>
			<div class="cell" data-row="3" data-column="2"></div>
			<div class="cell" data-row="3" data-column="3"></div>
		</div>
	</div>

	<div id="player2-info" class="player-info">
		<div class="player-header">
			<h2></h2>
			<div></div>
		</div>
		<div class="player-marker"></div>
	</div>

	<dialog id="player-settings">
		<form>
			<div id="player1-settings">
				<label>
					Player Name:
					<input name="player1-name" class="name-input" type="text" maxlength="10" required>
				</label>
				<div class="form-buttons">
					<label>
						Human or Bot?
						<button type="button" name="player1-human-select" class="human-select" value="human">
							<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user preview-icon"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
						</button>
					</label>
					<label>
						X or O?
						<button type="button" name="player1-marker-select" class="marker-select" value="X">
							<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x preview-icon"><path d="M22 2 2 22"/><path d="m2 2 20 20"/></svg>
						</button>
					</label>
				</div>
				<label>
					Choose Marker Color:
					<input name="player1-color" class="color-input" type="color" value="#F29191">
				</label>
			</div>

			<div id="player2-settings">
				<label>
					Player Name:
					<input name="player2-name" class="name-input" type="text" maxlength="10" value="AI" required>
				</label>
				<div class="form-buttons">
					<label>
						Human or Bot?
						<button type="button" name="player2-human-select" class="human-select" value="bot">
							<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-bot preview-icon"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
						</button>
					</label>
					<label>
						X or O?
						<button type="button" name="player2-marker-select" class="marker-select" value="O">
							<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle preview-icon"><circle cx="12" cy="12" r="10"/></svg>
						</button>
					</label>
				</div>
				<label>
					Choose Marker Color:
					<input name="player2-color" class="color-input" type="color" value="#B1E5E6">
				</label>
			</div>

			<button type="submit">Save</button>
		</form>
	</dialog>

	<dialog id="message-modal">

	</dialog>

	<script src="main.js"></script>
</body>
</html>
